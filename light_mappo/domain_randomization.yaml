domain_randomization:
  randomize: True
  min_frequency: 720
  randomization_params:
    observations:
      # on_reset:
      #   operation: "additive"
      #   distribution: "uniform"
      #   distribution_parameters: [2, 2]
      on_interval:
        frequency_interval: 2
        operation: "additive"
        distribution: "uniform"
        distribution_parameters: [3, 3]
